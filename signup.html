<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Recoda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/marketing.css">
  <script src="https://unpkg.com/lucide@0.344.0"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-base);
    }
    .auth-page-container {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-tertiary);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 32px;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--text-primary);
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .auth-subtitle {
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-tertiary);
    }
    .auth-footer a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .btn-lg {
      padding: 14px;
    }
  </style>
</head>
<body>

  <div class="auth-page-container">
    <a href="index.html" class="back-link">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      Back to Home
    </a>
    
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join Recoda for free today</p>

    <div id="signup-msg" style="display:none; padding:12px 16px; border-radius:10px; margin-bottom:20px; font-size:0.9rem;"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Min. 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary full-width btn-lg" id="btn-signup-submit">Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>

  <script type="module">
    import { initSupabaseClient, redirectIfAuthenticated } from '/js/auth-bootstrap.js';
    
    let supabase;
    const form = document.getElementById('signup-form');
    const btn = document.getElementById('btn-signup-submit');

    const msgEl = document.getElementById('signup-msg');
    function showMsg(text, isError) {
      msgEl.textContent = text;
      msgEl.style.display = 'block';
      msgEl.style.background = isError ? 'rgba(255,48,64,0.1)' : 'rgba(0,229,160,0.1)';
      msgEl.style.color = isError ? '#ff6b6b' : '#00e5a0';
      msgEl.style.border = isError ? '1px solid rgba(255,48,64,0.3)' : '1px solid rgba(0,229,160,0.3)';
    }

    try {
      supabase = await initSupabaseClient();
      if (!supabase) {
        showMsg('Auth service is temporarily unavailable.', true);
      } else {
        await redirectIfAuthenticated(supabase, '/app');
      }
    } catch (err) {
      console.error('Supabase init failed:', err);
      showMsg('Could not initialize sign up. Please try again.', true);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabase) return;
      msgEl.style.display = 'none';

      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      const { data, error } = await supabase.auth.signUp({ email, password });
      
      if (error) {
        showMsg(error.message, true);
        btn.textContent = 'Sign Up';
        btn.disabled = false;
      } else {
        showMsg('Account created! Please check your email for a confirmation link.', false);
        setTimeout(() => { window.location.href = '/login'; }, 2500);
      }
    });

    // Lucide
    lucide.createIcons();
  </script>
</body>
</html>
